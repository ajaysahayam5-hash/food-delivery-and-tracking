version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: food-delivery-postgres
    environment:
      POSTGRES_ROOT_PASSWORD: root
      POSTGRES_DB: food_delivery
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d food_delivery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - food-delivery-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food-delivery-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: food_delivery
      DB_USER: fooduser
      DB_PASSWORD: foodpass
      # Never commit real secrets — set JWT_SECRET in .env (see .env.example). Fails fast if missing in prod.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars) — see .env.example}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-delivery-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: food-delivery-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - food-delivery-network

volumes:
  postgres_data:

networks:
  food-delivery-network:
    driver: bridge