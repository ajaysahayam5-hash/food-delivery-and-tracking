server.port=8080

# PostgreSQL 15 Configuration (Production — Railway managed)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:food_delivery}
spring.datasource.username=${DB_USER:fooduser}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# SQL initialization (only for dev/profile-specific)
spring.sql.init.mode=never

# JWT — no default in prod: JWT_SECRET env is REQUIRED (fails fast if missing).
# Why: Review-II security — zero real secrets committed to GitHub.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.fooddelivery=INFO
logging.level.org.springframework.security=WARN

# OTP dev mode
app.otp.dev-mode=false