server.port=${PORT:8080}

# Default profile: dev (H2). Prod uses application-prod.properties with PostgreSQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT (dev-only insecure default; override via JWT_SECRET env in prod — never commit real secret)
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-in-prod-min-32-chars-0123456789abcdef}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (comma-separated; set Vercel URL in prod)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# OTP dev mode (logs OTP via logger; false in prod)
app.otp.dev-mode=${APP_OTP_DEV_MODE:true}

# Swagger UI enabled (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html