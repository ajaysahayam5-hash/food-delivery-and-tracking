services:
  - type: web
    name: food-delivery-backend
    runtime: java
    buildCommand: mvn -B clean package -DskipTests
    startCommand: java -jar target/food-delivery-backend-1.0.0.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: food_delivery
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_OTP_DEV_MODE
        value: false
    healthCheckPath: /api/health
